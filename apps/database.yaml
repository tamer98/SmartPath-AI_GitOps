apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/tamer98/SmartPath-AI_GitOps.git 
    targetRevision: HEAD
    path: database/mongodb
    helm:
      valueFiles:
        - ../dbvalues.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mongodb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

