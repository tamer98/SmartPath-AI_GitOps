apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/tamer98/SmartPath-AI_GitOps.git 
    targetRevision: HEAD
    path: path-finder-ai
  destination:
    server: "https://kubernetes.default.svc"
    namespace: application 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true