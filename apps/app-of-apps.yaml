apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer    
spec:
  project: default
  source:
    repoURL: https://github.com/tamer98/SmartPath-AI_GitOps.git 
    targetRevision: HEAD
    path: apps
    directory:
      recurse: false
      exclude: app-of-apps.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
